<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>personal website</title>
    <style>
        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        }
        html{
            scroll-behavior: smooth;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1,6;
            color: #222;
            background-color: #f8f9fa;
        }
        header{
            background:forestgreen;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav{
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h2{
            color: 2222563eb;
        }
        nav ul{
            list-style: none;
            display: flex;
            gap: 25px;
        }
        nav a {
            text-decoration:none ;
            color: #222;
            font-weight: 500;
        }

        nav a:hover{
            color: 2563eb;
        }

        .hero{
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .small text{
            color: 2563eb;
            font-size: 18px;
        }

        .hero h1{
            font-size: 64px;
            margin: 10px 0;
        }
        .hero h2 {
            font-size: 28px;
            font-weight: normal;
            color: #555;
        }
        .hero p{
            margin: 15px 0 25px;
        }
        .button{
            display: inline-block;
            padding: 12px 25px;
            background-color: #f8f9fa;
            color: #222;
            text-decoration: none;
            border-radius: 6px;
        }
        .button:hover {
            max-width: 1000px;
            margin: auto;
            padding: 80px 20px;
        }
        section{
            max-width: 1000px;
            margin: auto;
            padding: 80px 20px;
        }

        section >h2{
            font-size: 32px;
            margin-bottom: 20px;
        }

        .projects{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card{
            background: white;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .card h3{
            margin-bottom: 10px;
            color: rgb(41, 41, 40);
        }
        footer{
            text-align: center;
            padding: 25px;
            background: #222;
            color: white;
        }

        @media(max-width:700px){
        nav{
            flex-direction: column;
            gap: 15px;
        }
        }
        nav ul{
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hero h1{
            font-size: 48px;
        }
        .projects{
            grid-template-columns: 1fr;
        }
    

    </style>
</head>
<body>


   <header>
    <nav>
        <h2>Nontando</h2>
        <ul>
            <li><a href="index.html">HOME</a></li>
        <li><a href="About.html">About us</a></li>
       <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">contact</a></li>
        </ul>
    </nav>
   </header> 
</body>
<main>

    <section id="home"class="hero">
    <div>
        <p class="small text">HEY, I'M</p>
        <h1>Nontando</h1>
        <h2>WEB DEVELOPER</h2>
        <p>
            I create simply awesome and safe websites using HTML and CSS.
        </P>

        <a href="#contact"
    class="button">contact me</a>
    </div>
    </section>

            

    <footer>
        <p>&copy;2026 Nontando.All rights reserved.</p>
    </footer>

</main>
</html>
